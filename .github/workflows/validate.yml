name: Validate

on:
  push:
  pull_request:

jobs:
  core:
    name: Core checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out without LFS hydration
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CI checks
        run: npm run ci:check
