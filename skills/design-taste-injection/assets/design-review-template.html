<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="design-review-template-version" content="1">
  <meta name="design-review-initial-version-count" content="__INITIAL_VERSION_COUNT__">
  <title>Design Review</title>
  <style>
    :root{--paper:#f2ede4;--surface:#f8f4ec;--panel:#eee3d5;--ink:#171411;--muted:#777069;--rule:#211d18;--accent:#ad5d4d;--active-red:#c98070;--mono:"Courier New",Courier,monospace}*{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.workspace{width:100%;max-width:100vw;min-width:0;min-height:100vh;padding:18px;display:grid;align-content:start;gap:12px}.version-rail{display:flex;width:fit-content;max-width:100%;min-width:0;justify-self:start;overflow-x:auto;overflow-y:hidden;border:1px solid var(--rule);background:var(--surface);scrollbar-color:var(--accent) var(--panel);scrollbar-width:auto}.version-rail::-webkit-scrollbar{height:13px}.version-rail::-webkit-scrollbar-track{background:var(--panel);border-top:1px solid var(--rule)}.version-rail::-webkit-scrollbar-thumb{background:var(--accent);border:1px solid var(--rule)}.version-tab{appearance:none;flex:0 0 172px;min-height:58px;border:0;border-right:1px solid var(--rule);border-radius:0;background:transparent;padding:10px 12px 8px;text-align:left;font:700 10px/1 var(--mono);letter-spacing:.045em;text-transform:uppercase}.version-tab:last-child{border-right:0}.version-tab strong,.version-tab small{display:block}.version-tab strong{color:var(--accent);font-size:11px}.version-tab small{margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:8px;opacity:1}.version-tab:hover,.version-tab.is-active{background:var(--ink)}.version-tab:hover small,.version-tab.is-active small{color:var(--surface)}.version-tab:hover strong,.version-tab.is-active strong{color:var(--active-red)}.comparison-row{display:flex;width:100%;max-width:100%;min-width:0;min-height:61px;align-items:center;gap:10px;padding:10px;border:1px solid var(--rule);background:var(--surface)}.box-button,.box-select{appearance:none;min-height:39px;border:1px solid var(--rule);border-radius:0;background:transparent;padding:10px 12px 8px;font:700 10px/1 var(--mono);letter-spacing:.045em;text-transform:uppercase}.box-button:hover,.box-button.is-active{background:var(--ink);color:var(--surface)}.box-button:disabled{cursor:not-allowed;opacity:.45}.box-select{min-width:215px;background:var(--surface)}.comparison-note{align-self:center;color:var(--muted);font:700 9px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase}.preview-area,.compare-grid,.site-window{width:100%;max-width:100%;min-width:0}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}.compare-grid.is-single{grid-template-columns:1fr}.site-window{position:relative;height:calc(100vh - 180px);min-height:600px;overflow:hidden;border:1px solid #bdb4a7;border-radius:15px;background:#fff;box-shadow:0 18px 55px rgba(23,20,17,.14)}.site-window iframe{display:block;width:100%;height:100%;border:0;background:#fff}.window-label{position:absolute;z-index:4;top:10px;right:10px;padding:5px 8px;border:1px solid #ffffff77;border-radius:999px;background:#171411e8;color:#fff;font:700 9px/1 var(--mono);letter-spacing:.08em;pointer-events:none}.review-message{width:min(760px,100%);padding:24px;border:1px solid var(--rule);background:var(--surface);font:700 11px/1.6 var(--mono);letter-spacing:.025em}.review-message strong{display:block;margin-bottom:8px;color:var(--accent);text-transform:uppercase}.review-message p{margin:0;color:var(--muted)}@media(max-width:820px){.comparison-row{align-items:stretch;flex-wrap:wrap}.box-select{flex:1 1 220px;min-width:0}.compare-grid{grid-template-columns:1fr}.site-window{height:650px}}@media(max-width:520px){.workspace{padding:9px}.comparison-row{display:grid;grid-template-columns:1fr}.box-select{width:100%}.site-window{height:590px;min-height:520px}}
  </style>
</head>
<body>
  <main class="workspace">
    <nav class="version-rail" id="versionRail" aria-label="Design versions"></nav>
    <section class="comparison-row" id="comparisonControls" aria-label="Comparison controls"></section>
    <section class="preview-area" id="previewArea"></section>
  </main>
  <!-- Initial Prompt 1 range: V1 -> v1/index.html through V__INITIAL_VERSION_COUNT__ -> v__INITIAL_VERSION_COUNT__/index.html. This guidance is generated from the active selection count and is not a fixed slot limit. -->
  <!-- Edit only the JSON array below. It accepts any number of design entries. -->
  <script type="application/json" id="design-review-entries">
__DESIGN_REVIEW_ENTRIES__
  </script>
  <script>
    const esc=(value='')=>String(value).replace(/[&<>"']/g,(character)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const attr=(value='')=>esc(value).replace(/`/g,'&#96;');
    const safeRelativePath=(value)=>typeof value==='string'&&value.endsWith('/index.html')&&!/^(?:[a-z]+:|[\\/])/i.test(value)&&!value.includes('\\')&&!value.split('/').some((segment)=>segment===''||segment==='.'||segment==='..');
    const readDesigns=()=>{
      const raw=document.querySelector('#design-review-entries')?.textContent??'[]';
      const parsed=JSON.parse(raw);
      if(!Array.isArray(parsed))throw new Error('design-review-entries must contain a JSON array.');
      const ids=new Set();const paths=new Set();
      return parsed.map((entry,index)=>{
        if(!entry||typeof entry!=='object'||Array.isArray(entry))throw new Error(`Entry ${index+1} must be an object.`);
        const id=typeof entry.id==='string'?entry.id.trim():'';const name=typeof entry.name==='string'?entry.name.trim():'';const path=typeof entry.path==='string'?entry.path.trim():'';
        if(!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(id))throw new Error(`Entry ${index+1} has an invalid id.`);
        if(!name)throw new Error(`Entry ${index+1} requires a readable name.`);
        if(!safeRelativePath(path))throw new Error(`Entry ${index+1} requires a safe relative path ending in /index.html.`);
        if(ids.has(id))throw new Error(`Duplicate design id: ${id}.`);if(paths.has(path))throw new Error(`Duplicate design path: ${path}.`);
        ids.add(id);paths.add(path);return{id,name,path};
      });
    };
    const showMessage=(title,message)=>{document.querySelector('#versionRail').hidden=true;document.querySelector('#comparisonControls').hidden=true;document.querySelector('#previewArea').innerHTML=`<div class="review-message" role="status"><strong>${esc(title)}</strong><p>${esc(message)}</p></div>`};
    try{
      const designs=readDesigns();
      if(!designs.length){showMessage('Design review template','Add one object per generated version to the design-review-entries JSON array. There is no fixed tab limit.');}
      else{
        const state={left:0,right:designs.length>1?1:0,compare:false};
        const options=(selected)=>designs.map((design,index)=>`<option value="${index}" ${index===selected?'selected':''}>${esc(design.id)} · ${esc(design.name)}</option>`).join('');
        const select=(side)=>`<select class="box-select" data-select="${side}" aria-label="${side==='left'?'Left comparison version':'Right comparison version'}">${options(state[side])}</select>`;
        const windowFor=(index,label='')=>{const design=designs[index];return`<div class="site-window"><span class="window-label">${esc(label)}${esc(design.id)}</span><iframe title="${attr(design.name)}" src="${attr(design.path)}"></iframe></div>`};
        const render=()=>{
          document.querySelector('#versionRail').innerHTML=designs.map((design,index)=>`<button class="version-tab ${index===state.left?'is-active':''}" data-version="${index}"><strong>${esc(design.id)}</strong><small>${esc(design.name)}</small></button>`).join('');
          document.querySelector('#comparisonControls').innerHTML=`<button class="box-button ${state.compare?'is-active':''}" data-action="toggle" ${designs.length<2?'disabled':''}>${state.compare?'Comparison on':'Compare two'}</button>${state.compare?`${select('left')}${select('right')}`:'<span class="comparison-note">Select a version above for focused review.</span>'}`;
          document.querySelector('#previewArea').innerHTML=`<div class="compare-grid ${state.compare?'':'is-single'}">${windowFor(state.left,state.compare?'A · ':'')}${state.compare?windowFor(state.right,'B · '):''}</div>`;
        };
        document.addEventListener('click',(event)=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.version!==undefined){state.left=Number(button.dataset.version);if(state.left===state.right&&designs.length>1)state.right=(state.right+1)%designs.length;}else if(button.dataset.action==='toggle'&&designs.length>1){state.compare=!state.compare;}else{return;}render();});
        document.addEventListener('change',(event)=>{const element=event.target.closest('select');if(!element)return;state[element.dataset.select]=Number(element.value);if(state.left===state.right&&designs.length>1){if(element.dataset.select==='left')state.right=(state.left+1)%designs.length;else state.left=(state.right+designs.length-1)%designs.length;}render();});
        render();
      }
    }catch(error){showMessage('Design review setup error',error instanceof Error?error.message:String(error));}
  </script>
</body>
</html>
